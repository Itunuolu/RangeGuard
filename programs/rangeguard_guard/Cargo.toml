[package]
name = "rangeguard_guard"
version = "0.1.0"
description = "On-chain policy guard for RangeGuard delegated LP autonomy"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rangeguard_guard"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.31.1"
